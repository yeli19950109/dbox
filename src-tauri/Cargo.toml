[package]
name = "dbox"
version = "0.1.0"
description = "A local command-line tool manager"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
atomic-write-file = "=0.3.1"
blake3 = "1.8"
bstr = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
process-wrap = { version = "10.0.0", features = ["tokio1"] }
regex = "1"
secrecy = "0.10"
semver = { version = "1", features = ["serde"] }
serde_path_to_error = "0.1"
shell-quote = "0.7.2"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
which = "8"

[dev-dependencies]
tempfile = "3"
