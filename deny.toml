[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "specta 2.0.0-rc.25 transitively uses the unmaintained paste crate; accepted until 2026-11-27 under ADR 0003" },
  { id = "RUSTSEC-2025-0075", reason = "Tauri urlpattern transitively uses the unmaintained unic family; accepted until 2026-11-27 under ADR 0003" },
  { id = "RUSTSEC-2025-0080", reason = "Tauri urlpattern transitively uses the unmaintained unic family; accepted until 2026-11-27 under ADR 0003" },
  { id = "RUSTSEC-2025-0081", reason = "Tauri urlpattern transitively uses the unmaintained unic family; accepted until 2026-11-27 under ADR 0003" },
  { id = "RUSTSEC-2025-0098", reason = "Tauri urlpattern transitively uses the unmaintained unic family; accepted until 2026-11-27 under ADR 0003" },
  { id = "RUSTSEC-2025-0100", reason = "Tauri urlpattern transitively uses the unmaintained unic family; accepted until 2026-11-27 under ADR 0003" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  # Rustls root data and ring/webpki; see ADR 0004 and bundled license texts.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/tauri-apps/fix-path-env-rs"]
